<!DOCTYPE html>
<html lang="pl">
<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📷</text></svg>">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotografia Ślubna - Jan Kowalski</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-neutral-950 text-neutral-100 font-sans antialiased pt-16 md:pt-20 selection:bg-white selection:text-black">

    <!-- Nawigacja -->
    <nav class="fixed top-0 left-0 w-full z-50 bg-neutral-950/90 backdrop-blur-md border-b border-neutral-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16 md:h-20">
                <!-- Logo -->
                <a href="index.html" class="text-xl md:text-2xl font-light tracking-widest uppercase hover:text-white transition">
                    Kowalski.
                </a>
                
                <!-- Menu na komputery -->
                <div class="hidden md:flex space-x-8 text-sm uppercase tracking-wide text-neutral-400">
                    <a href="portrety.html" class="hover:text-white transition">Portrety</a>
                    <a href="slubna.html" class="text-white border-b border-white pb-1">Ślubna</a>
                    <a href="artystyczna.html" class="hover:text-white transition">Artystyczna</a>
                    <a href="cennik.html" class="hover:text-white transition">Cennik</a>
                    <a href="kontakt.html" class="hover:text-white transition">Kontakt</a>
                </div>

                <!-- Przycisk Hamburgera (widoczny tylko na telefonie) -->
                <button id="mobile-menu-btn" aria-label="Otwórz menu" class="md:hidden text-neutral-300 hover:text-white focus:outline-none p-2">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path id="menu-icon" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Rozwijane menu mobilne -->
        <div id="mobile-menu" class="hidden md:hidden bg-neutral-950/95 border-b border-neutral-800 px-6 py-6 space-y-4 text-center text-sm uppercase tracking-widest text-neutral-400">
            <a href="portrety.html" class="block py-2 hover:text-white transition">Portrety</a>
            <a href="slubna.html" class="block py-2 text-white font-medium">Ślubna</a>
            <a href="artystyczna.html" class="block py-2 hover:text-white transition">Artystyczna</a>
            <a href="cennik.html" class="block py-2 hover:text-white transition">Cennik</a>
            <a href="kontakt.html" class="block py-2 hover:text-white transition">Kontakt</a>
        </div>
    </nav>

    <!-- Galeria Ślubna -->
    <section class="py-12 md:py-24 px-4 sm:px-6 min-h-[calc(100dvh-140px)] max-w-7xl mx-auto">
        <h2 class="text-2xl sm:text-3xl font-light uppercase tracking-widest mb-8 md:mb-12 text-center border-b border-neutral-800 pb-4 md:pb-6">
            Fotografia Ślubna
        </h2>
        
        <!-- Siatka ze zdjęciami (1 kolumna na telefonie, 2 na tablecie, 3 na komputerze) -->
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 sm:gap-6">
            <img src="zs1.jpeg" alt="Zdjęcie ślubne 1" class="w-full h-[380px] sm:h-[450px] md:h-[500px] object-cover hover:opacity-80 transition duration-300">
            <img src="zs2.jpeg" alt="Zdjęcie ślubne 2" class="w-full h-[380px] sm:h-[450px] md:h-[500px] object-cover hover:opacity-80 transition duration-300">
            <img src="zs3.jpeg" alt="Zdjęcie ślubne 3" class="w-full h-[380px] sm:h-[450px] md:h-[500px] object-cover hover:opacity-80 transition duration-300">
        </div>
    </section>

    <!-- Stopka -->
    <footer class="text-center py-6 px-4 border-t border-neutral-900 text-neutral-600 text-xs sm:text-sm">
        <p>&copy; 2026 Jan Kowalski Fotografia. Wszelkie prawa zastrzeżone.</p>
    </footer>

    <!-- Skrypt obsługujący otwieranie/zamykanie menu na telefonie -->
    <script>
        const btn = document.getElementById('mobile-menu-btn');
        const menu = document.getElementById('mobile-menu');
        const icon = document.getElementById('menu-icon');

        btn.addEventListener('click', () => {
            menu.classList.toggle('hidden');
            
            if (menu.classList.contains('hidden')) {
                icon.setAttribute('d', 'M4 6h16M4 12h16M4 18h16');
            } else {
                icon.setAttribute('d', 'M6 18L18 6M6 6l12 12');
            }
        });
    </script>

</body>
</html>
